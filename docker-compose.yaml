# Phases 10-11 only (SPEC §24): local LiveKit + Postgres. Phases 0-9 use LiveKit Cloud + hosted Supabase.
# Pin image versions before relying on this.
services:
  livekit:
    image: livekit/livekit-server:latest
    command: --dev --bind 0.0.0.0        # dev keys: devkey / secret (local use only)
    ports:
      - "7880:7880"        # signalling (ws)
      - "7881:7881"        # WebRTC over TCP fallback
      - "7882:7882/udp"    # WebRTC media (dev mode)
    restart: unless-stopped

  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: honda_voice
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./data/migrations:/docker-entrypoint-initdb.d:ro   # applied on first start only
    restart: unless-stopped

volumes:
  pgdata: