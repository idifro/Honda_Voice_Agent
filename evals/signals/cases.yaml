- id: mt-daughter-college
  labels: {rider: child, use_case: college}
  context:
    - caller:
        en: "I need a scooter for my daughter."
        hi: "मेरी बेटी के लिए scooter चाहिए।"
        ta: "என் பொண்ணுக்கு ஒரு scooter வேணும்."
        te: "మా అమ్మాయి కోసం scooter కావాలి."
        ml: "എന്റെ മകൾക്ക് ഒരു scooter വേണം."
        kn: "ನನ್ನ ಮಗಳಿಗೆ ಒಂದು scooter ಬೇಕು."
    - agent:
        en: "Sure. What will she mostly use it for?"
        hi: "Zaroor. Woh zyadatar kis kaam ke liye chalayengi?"
        ta: "சரி. அவங்க பெரும்பாலும் எதுக்கு use பண்ணுவாங்க?"
        te: "సరే. ఆమె ఎక్కువగా దేనికి వాడతారు?"
        ml: "ശരി. അവൾ കൂടുതലും എന്തിനാണ് ഉപയോഗിക്കുക?"
        kn: "ಸರಿ. ಅವರು ಹೆಚ್ಚಾಗಿ ಯಾವುದಕ್ಕೆ ಬಳಸ್ತಾರೆ?"
  text:
    en: College, about ten kilometres a day.
    hi: College के लिए, रोज़ लगभग दस kilometre।
    ta: College-க்கு, தினமும் பத்து kilometre கிட்ட.
    te: College కి, రోజూ సుమారు పది kilometre.
    ml: College-ലേക്ക്, ദിവസവും ഏകദേശം പത്ത് kilometre.
    kn: College ಗೆ, ದಿನಾ ಸುಮಾರು ಹತ್ತು kilometre.

- id: mt-unicorn-emi
  labels: {timeline: this_month, payment_interest: [emi]}
  context:
    - caller:
        en: "What's the price of the Unicorn?"
        hi: "Unicorn की price क्या है?"
        ta: "Unicorn விலை என்ன?"
        te: "Unicorn ధర ఎంత?"
        ml: "Unicorn-ന്റെ വില എത്ര?"
        kn: "Unicorn ಬೆಲೆ ಎಷ್ಟು?"
    - agent:
        en: "About one lakh fifteen thousand ex-showroom. When are you planning to buy?"
        hi: "Lagbhag 1 lakh 15 hazaar ex-showroom. Aap kab lena chahte hain?"
        ta: "சுமார் 1,15,800 ரூபாய் ex-showroom. எப்போ வாங்க plan பண்றீங்க?"
        te: "సుమారు 1,15,800 రూపాయలు ex-showroom. ఎప్పుడు కొనాలని అనుకుంటున్నారు?"
        ml: "ഏകദേശം 1,15,800 രൂപ ex-showroom. എപ്പോഴാണ് വാങ്ങാൻ ഉദ്ദേശിക്കുന്നത്?"
        kn: "ಸುಮಾರು 1,15,800 ರೂಪಾಯಿ ex-showroom. ಯಾವಾಗ ತಗೋಬೇಕು ಅಂತಿದ್ದೀರಾ?"
  text:
    en: Within this month, if EMI is available.
    hi: इसी महीने, अगर EMI मिल जाए तो।
    ta: இந்த மாசத்துக்குள்ள, EMI கிடைச்சா.
    te: ఈ నెలలోనే, EMI దొరికితే.
    ml: ഈ മാസത്തിനുള്ളിൽ, EMI കിട്ടുമെങ്കിൽ.
    kn: ಈ ತಿಂಗಳೊಳಗೆ, EMI ಸಿಕ್ಕಿದರೆ.

- id: mt-commute-mileage
  labels: {use_case: commute, priorities: [mileage], budget_inr: 90000}
  context:
    - caller:
        en: "I'm looking for a bike under ninety thousand."
        hi: "नब्बे हज़ार के अंदर कोई bike चाहिए।"
        ta: "தொண்ணூறு ஆயிரத்துக்குள்ள ஒரு bike வேணும்."
        te: "తొంభై వేల లోపు ఒక bike కావాలి."
        ml: "തൊണ്ണൂറായിരത്തിന് താഴെ ഒരു bike വേണം."
        kn: "ತೊಂಬತ್ತು ಸಾವಿರದ ಒಳಗೆ ಒಂದು bike ಬೇಕು."
    - agent:
        en: "Is it mainly for office travel?"
        hi: "Kya yeh zyadatar office jaane ke liye hai?"
        ta: "இது முக்கியமா office போறதுக்கா?"
        te: "ఇది ముఖ్యంగా office కి వెళ్ళడానికా?"
        ml: "ഇത് പ്രധാനമായും office-ൽ പോകാനാണോ?"
        kn: "ಇದು ಮುಖ್ಯವಾಗಿ office ಗೆ ಹೋಗೋಕಾ?"
  text:
    en: Yes, and good mileage matters most.
    hi: हाँ, और mileage अच्छा होना सबसे ज़रूरी है।
    ta: ஆமா, mileage நல்லா இருக்கறது தான் முக்கியம்.
    te: అవును, mileage బాగుండటం ముఖ్యం.
    ml: അതെ, mileage നല്ലതാവണം, അതാണ് പ്രധാനം.
    kn: ಹೌದು, mileage ಚೆನ್ನಾಗಿರೋದೇ ಮುಖ್ಯ.

- id: mt-cb350-later
  labels: {timeline: later_or_browsing, purchase_intent: 1}
  context:
    - caller:
        en: "Tell me about the CB350."
        hi: "CB350 के बारे में बताइए।"
        ta: "CB350 பத்தி சொல்லுங்க."
        te: "CB350 గురించి చెప్పండి."
        ml: "CB350-നെ കുറിച്ച് പറയൂ."
        kn: "CB350 ಬಗ್ಗೆ ಹೇಳಿ."
    - agent:
        en: "It's a 350 cc retro bike. Would you like to book a test ride?"
        hi: "Yeh 350 cc ki retro bike hai. Kya aap test ride book karna chahenge?"
        ta: "இது 350 cc retro bike. Test ride book பண்ணலாமா?"
        te: "ఇది 350 cc retro bike. Test ride book చేయమంటారా?"
        ml: "ഇത് 350 cc retro bike ആണ്. Test ride book ചെയ്യട്ടെ?"
        kn: "ಇದು 350 cc retro bike. Test ride book ಮಾಡಲಾ?"
  text:
    en: No, just checking for now, maybe next year.
    hi: नहीं, अभी बस देख रहा हूँ, शायद अगले साल।
    ta: வேண்டாம், இப்போ சும்மா பார்க்கறேன், அடுத்த வருஷம் பார்க்கலாம்.
    te: వద్దు, ఇప్పుడు ఊరికే చూస్తున్నాను, బహుశా వచ్చే సంవత్సరం.
    ml: വേണ്ട, ഇപ്പോൾ വെറുതെ നോക്കുകയാണ്, ഒരുപക്ഷേ അടുത്ത വർഷം.
    kn: ಬೇಡ, ಈಗ ಸುಮ್ಮನೆ ನೋಡ್ತಿದ್ದೀನಿ, ಬಹುಶಃ ಮುಂದಿನ ವರ್ಷ.

- id: mt-wife-learner
  labels: {rider: spouse, experience: first_two_wheeler}
  context:
    - caller:
        en: "Book a test ride for the Activa."
        hi: "Activa की test ride book करनी है।"
        ta: "Activa test ride book பண்ணணும்."
        te: "Activa test ride book చేయాలి."
        ml: "Activa test ride book ചെയ്യണം."
        kn: "Activa test ride book ಮಾಡಬೇಕು."
    - agent:
        en: "Do you have a valid driving licence?"
        hi: "Kya aapke paas valid driving licence hai?"
        ta: "உங்ககிட்ட valid driving licence இருக்கா?"
        te: "మీ దగ్గర valid driving licence ఉందా?"
        ml: "നിങ്ങളുടെ കയ്യിൽ valid driving licence ഉണ്ടോ?"
        kn: "ನಿಮ್ಮ ಹತ್ತಿರ valid driving licence ಇದೆಯಾ?"
  text:
    en: Not yet, actually it's for my wife, she is just learning to ride.
    hi: अभी नहीं, असल में ये मेरी wife के लिए है, वो अभी चलाना सीख रही है।
    ta: இன்னும் இல்ல, உண்மையில இது என் wife-க்கு, அவங்க இப்போ தான் ஓட்ட கத்துக்கறாங்க.
    te: ఇంకా లేదు, నిజానికి ఇది నా wife కోసం, ఆమె ఇప్పుడే నడపడం నేర్చుకుంటోంది.
    ml: ഇതുവരെ ഇല്ല, സത്യത്തിൽ ഇത് എന്റെ wife-ന് വേണ്ടിയാണ്, അവൾ ഓടിക്കാൻ പഠിക്കുന്നതേയുള്ളൂ.
    kn: ಇನ್ನೂ ಇಲ್ಲ, ನಿಜ ಹೇಳಬೇಕಂದ್ರೆ ಇದು ನನ್ನ wife ಗೆ, ಅವರು ಈಗಷ್ಟೇ ಓಡಿಸೋದು ಕಲೀತಾ ಇದ್ದಾರೆ.
